# Application Configuration for ExpenseHub
server.port=8082
# Active profile: 'local' by default (reads application-local.properties).
# On Render/production, set env var SPRING_PROFILES_ACTIVE=prod to override.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ----------------- DATABASE CONFIGURATION -----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:expensehub_db}?options=-c%20timezone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password123}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# ----------------- MAIL SENDER CONFIGURATION -----------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----------------- SECURITY & JWT CONFIGURATION -----------------
# 256-bit secret key for HMAC-SHA256 (Base64 or Plain String)
security.jwt.secret=${SECURITY_JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm}
# Token expiration time: 86400000 ms (24 hours)
security.jwt.expiration=86400000

# ----------------- KEYCLOAK CONFIGURATION -----------------
# Root issuer for validation (must match Keycloak realm identifier)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/expensehub}
# JWK Set URI allows the backend to validate tokens even if Keycloak is booted after Spring Boot
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8081/realms/expensehub/protocol/openid-connect/certs}

# Keycloak Admin/Service properties used by KeycloakAuthService
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:expensehub}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:expensehub-app}
keycloak.admin.username=${KEYCLOAK_ADMIN:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# ----------------- GEMINI API CONFIGURATION -----------------
# Set GEMINI_API_KEY in ExpenseHub/.env (loaded by VS Code launch.json)
gemini.api.key=${GEMINI_API_KEY:}

# Allow file upload configurations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
