<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#glowPurple)" />
  <rect width="1200" height="420" rx="16" fill="url(#glowCyan)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Left Side: Brand Logo & Title -->
  <g transform="translate(80, 75)">
    <!-- Brand Icon -->
    <g filter="url(#shadow)">
      <rect width="68" height="68" rx="18" fill="url(#primaryGrad)" />
      <!-- Wallet / Vault Vector Icon -->
      <path d="M22 24h24a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3V27a3 3 0 0 1 3-3zm0-4h20a1 1 0 0 1 1 1v1H21v-1a1 1 0 0 1 1-1zm21 14h-4a2 2 0 1 0 0 4h4v-4z" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="88" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Expense<tspan fill="url(#primaryGrad)">Hub</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Smart full-stack personal finance tracker &amp; AI-driven wealth manager.
    </text>

    <!-- Badge Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: Keycloak SSO -->
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#38bdf8" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Keycloak SSO</text>

      <!-- Pill 2: Gemini AI -->
      <rect x="142" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="158" cy="17" r="5" fill="#a855f7" />
      <text x="172" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Gemini AI Advisor</text>

      <!-- Pill 3: React 19 + Spring Boot -->
      <rect x="289" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="305" cy="17" r="5" fill="#34d399" />
      <text x="319" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">React 19 + Spring Boot 3</text>
    </g>

    <!-- Demo Link Callout -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)" />
      <text x="28" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        EXPLORE LIVE DEMO ↗
      </text>
    </g>
  </g>

  <!-- Right Side: Decorative Floating Finance Cards -->
  <g transform="translate(720, 55)" filter="url(#shadow)">
    <!-- Main Floating Balance Card -->
    <rect x="0" y="0" width="400" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TOTAL NET BALANCE</text>
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$24,850.00</text>
    <rect x="24" y="96" width="94" height="22" rx="6" fill="#064e3b" />
    <text x="34" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">▲ +14.2% MoM</text>

    <!-- Income & Expense Mini Cards -->
    <g transform="translate(0, 150)">
      <!-- Income Card -->
      <rect x="0" y="0" width="192" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="30" r="12" fill="#064e3b" />
      <path d="M28 24v12m-4-4l4-4 4 4" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Income</text>
      <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$8,420.00</text>
      <rect x="20" y="88" width="60" height="4" rx="2" fill="url(#emeraldGrad)" />

      <!-- Expense Card -->
      <rect x="208" y="0" width="192" height="110" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="236" cy="30" r="12" fill="#881337" />
      <path d="M236 36V24m-4 4l4 4 4-4" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="256" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Expenses</text>
      <text x="228" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$3,150.00</text>
      <rect x="228" y="88" width="60" height="4" rx="2" fill="url(#roseGrad)" />
    </g>
  </g>
</svg>
