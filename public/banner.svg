<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- ExpenseHub Warm Forest Fintech Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="60%" stop-color="#0f1c15" />
      <stop offset="100%" stop-color="#09110d" />
    </linearGradient>

    <!-- Forest Accent Glow -->
    <radialGradient id="forestGlow" cx="20%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1B5E3F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1B5E3F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="softGlowRight" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#164F34" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#164F34" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15261d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f1c15" stop-opacity="0.95" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247852" />
      <stop offset="100%" stop-color="#1B5E3F" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="14" fill="url(#forestGlow)" />
  <rect width="1200" height="320" rx="14" fill="url(#softGlowRight)" />

  <!-- Subtle Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="13.5" fill="none" stroke="#223d2e" stroke-opacity="0.6" stroke-width="1" />

  <!-- Minimal Fine Dot Pattern -->
  <g opacity="0.08" fill="#DEDDD6">
    <circle cx="80" cy="40" r="1.2" />
    <circle cx="160" cy="40" r="1.2" />
    <circle cx="240" cy="40" r="1.2" />
    <circle cx="320" cy="40" r="1.2" />
    <circle cx="400" cy="40" r="1.2" />
    <circle cx="480" cy="40" r="1.2" />
    <circle cx="560" cy="40" r="1.2" />
    <circle cx="640" cy="40" r="1.2" />
    <circle cx="720" cy="40" r="1.2" />
    <circle cx="80" cy="120" r="1.2" />
    <circle cx="160" cy="120" r="1.2" />
    <circle cx="240" cy="120" r="1.2" />
    <circle cx="320" cy="120" r="1.2" />
    <circle cx="400" cy="120" r="1.2" />
    <circle cx="480" cy="120" r="1.2" />
    <circle cx="560" cy="120" r="1.2" />
    <circle cx="640" cy="120" r="1.2" />
    <circle cx="720" cy="120" r="1.2" />
    <circle cx="80" cy="200" r="1.2" />
    <circle cx="160" cy="200" r="1.2" />
    <circle cx="240" cy="200" r="1.2" />
    <circle cx="320" cy="200" r="1.2" />
    <circle cx="400" cy="200" r="1.2" />
    <circle cx="480" cy="200" r="1.2" />
    <circle cx="560" cy="200" r="1.2" />
    <circle cx="640" cy="200" r="1.2" />
    <circle cx="720" cy="200" r="1.2" />
    <circle cx="80" cy="280" r="1.2" />
    <circle cx="160" cy="280" r="1.2" />
    <circle cx="240" cy="280" r="1.2" />
    <circle cx="320" cy="280" r="1.2" />
    <circle cx="400" cy="280" r="1.2" />
    <circle cx="480" cy="280" r="1.2" />
    <circle cx="560" cy="280" r="1.2" />
    <circle cx="640" cy="280" r="1.2" />
    <circle cx="720" cy="280" r="1.2" />
  </g>

  <!-- Left: Minimal Brand Identity -->
  <g transform="translate(70, 70)">
    <!-- Wallet Icon in Website Accent Color (#1B5E3F) -->
    <rect width="52" height="52" rx="14" fill="url(#iconGrad)" stroke="#2d6a4f" stroke-width="1" />
    <g transform="translate(14, 14)">
      <!-- Clean Wallet SVG Path -->
      <path d="M19 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM4 3h13a1 1 0 0 1 1 1v1H3V4a1 1 0 0 1 1-1z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="16" cy="12" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Main Title -->
    <text x="68" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.03em">
      Expense<tspan fill="#34D399">Hub</tspan>
    </text>

    <!-- Clean Tagline -->
    <text x="2" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9C9B92">
      Full-stack personal finance tracker with Google Gemini AI and Keycloak SSO.
    </text>

    <!-- Tech Badges Minimal Pill Row -->
    <g transform="translate(2, 118)">
      <!-- Pill 1: Spring Boot -->
      <rect x="0" y="0" width="118" height="28" rx="6" fill="#13231a" stroke="#233e2f" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#34D399" />
      <text x="26" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EAF3EE">Spring Boot 3</text>

      <!-- Pill 2: React 19 -->
      <rect x="126" y="0" width="94" height="28" rx="6" fill="#13231a" stroke="#233e2f" stroke-width="1" />
      <circle cx="140" cy="14" r="3.5" fill="#60A5FA" />
      <text x="152" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EAF3EE">React 19</text>

      <!-- Pill 3: Keycloak SSO -->
      <rect x="228" y="0" width="115" height="28" rx="6" fill="#13231a" stroke="#233e2f" stroke-width="1" />
      <circle cx="242" cy="14" r="3.5" fill="#38BDF8" />
      <text x="254" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EAF3EE">Keycloak SSO</text>

      <!-- Pill 4: Gemini AI -->
      <rect x="351" y="0" width="128" height="28" rx="6" fill="#13231a" stroke="#233e2f" stroke-width="1" />
      <circle cx="365" cy="14" r="3.5" fill="#A78BFA" />
      <text x="377" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EAF3EE">Google Gemini</text>
    </g>
  </g>

  <!-- Right: Minimalist Fintech Metrics Card -->
  <g transform="translate(740, 56)" filter="url(#cardShadow)">
    <rect width="390" height="208" rx="12" fill="url(#cardBg)" stroke="#233e2f" stroke-width="1.2" />

    <!-- Top Card Header -->
    <text x="24" y="34" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9C9B92" letter-spacing="0.06em">TOTAL BALANCE</text>
    <text x="24" y="68" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">$24,850.00</text>

    <!-- Growth Badge -->
    <rect x="286" y="20" width="80" height="22" rx="4" fill="#143a27" stroke="#1B5E3F" stroke-width="1" />
    <text x="296" y="35" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34D399">+14.2% MoM</text>

    <!-- Divider -->
    <line x1="24" y1="88" x2="366" y2="88" stroke="#1e3428" stroke-width="1" />

    <!-- Income & Expense Split -->
    <g transform="translate(24, 106)">
      <!-- Income Column -->
      <g>
        <circle cx="8" cy="8" r="4" fill="#1A7F4E" />
        <text x="20" y="12" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#9C9B92">Total Income</text>
        <text x="0" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">+$8,420.00</text>
      </g>

      <!-- Expense Column -->
      <g transform="translate(180, 0)">
        <circle cx="8" cy="8" r="4" fill="#B91C1C" />
        <text x="20" y="12" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#9C9B92">Total Expenses</text>
        <text x="0" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">-$3,150.00</text>
      </g>
    </g>

    <!-- Progress / Savings Ratio Bar -->
    <g transform="translate(24, 172)">
      <rect width="342" height="6" rx="3" fill="#192a20" />
      <rect width="248" height="6" rx="3" fill="#1B5E3F" />
      <text x="0" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#68675F">SAVINGS RATE: 62.6%</text>
    </g>
  </g>
</svg>
